<!DOCTYPE html>
<html lang="en">
<head>
<!-- Cookiebot Cookie Consent Banner -->
<script id="Cookiebot" src="https://consent.cookiebot.com/uc.js" data-cbid="b22f8c48-6a34-4c8e-b06d-b1584a6fefa5" data-blockingmode="auto" type="text/javascript"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Pace Digital Works</title>

<!-- This page exists so Cloudflare Pages answers a wrong address with a real
     "not found" status. Without it, every wrong address returned the home
     page with a "success" status, which made Google treat broken links as
     copies of the home page, and let a missing image be cached for a year. -->
<meta name="robots" content="noindex, follow">
<script>if(location.hostname.endsWith('.pages.dev')){location.replace('https://pacedigitalworks.com'+location.pathname+location.search+location.hash);}</script>

<!-- Fonts are served from this site, not from Google. The two files the
     first screen needs are preloaded so the headline does not flash in a
     fallback typeface first. See section 0 of pace.css. -->
<link rel="preload" href="/assets/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<!-- ?v= is a cache-buster — see the note in index.html. Keep the number the
     same on every page, and change it on every page together. -->
<link rel="stylesheet" href="/assets/css/pace.css?v=20260831">
<link rel="icon" href="/favicon.ico?v=20260913" sizes="48x48">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=20260913">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=20260913">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png?v=20260913">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png?v=20260913">

<style>
  .nf {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: var(--sp-8, 40px) 24px;
    gap: 18px;
  }
  .nf__num {
    font-family: var(--font-display);
    font-size: clamp(64px, 12vw, 132px);
    line-height: 1;
    color: var(--clay);
    letter-spacing: -.02em;
  }
  .nf__t {
    font-family: var(--font-display);
    font-size: clamp(24px, 4vw, 34px);
    line-height: 1.2;
    color: var(--ink);
    margin: 0;
  }
  .nf__p {
    font-family: var(--font-body);
    font-size: 15.5px;
    line-height: 1.65;
    color: var(--body);
    max-width: 46ch;
    margin: 0;
  }
  .nf__links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 26px;
    justify-content: center;
    margin-top: 8px;
    font-family: var(--font-body);
    font-size: 14px;
  }
  .nf__links a { color: var(--clay-ink); }
</style>
</head>
<body>

<main class="nf">
  <div class="nf__num">404</div>
  <h1 class="nf__t">This page has moved or never existed</h1>
  <p class="nf__p">
    The address you opened is not on this site. Nothing is broken on your side —
    the link was probably mistyped or is out of date.
  </p>
  <nav class="nf__links">
    <a href="/">Back to the home page</a>
    <a href="/#examples">See example websites</a>
    <a href="/#start">Get in touch</a>
  </nav>
</main>

</body>
</html>
